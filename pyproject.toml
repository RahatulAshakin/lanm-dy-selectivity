[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lanm-dy-selectivity"
version = "0.1.0"
description = "Phase 1 CLI scaffold for reproducible lanmodulin selectivity analysis."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "OpenAI Codex" }]
dependencies = []

[project.optional-dependencies]
phase1 = [
    "pandas",
    "numpy",
    "scipy",
    "gemmi",
    "openmm",
    "matplotlib",
    "pyyaml",
    "pydantic",
    "click",
    "rich",
    "requests",
    "python-docx",
]
dev = [
    "pytest",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
